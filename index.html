<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tickets</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- ==================== SCREEN 1: TICKETS ==================== -->
  <div class="screen active" id="screen-tickets">
    <!-- HEADER -->
    <header class="hdr">
      <button class="hdr-back" aria-label="Back">
        <svg width="11" height="20" viewBox="0 0 11 20" fill="none"><path d="M10 1L1 10l9 9" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="hdr-title">Tickets</span>
      <button class="hdr-transfer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M8 10h8M8 14h5"/></svg>
        Transfer
      </button>
    </header>
    <!-- CONTENT -->
    <div class="content" id="content-tickets">
      <!-- Event alert -->
      <div class="alert">
        <div class="alert-body">
          <div class="alert-icon-wrap">
            <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#e6a817"/><text x="12" y="17" text-anchor="middle" fill="#fff" font-size="16" font-weight="800" font-family="Inter,sans-serif">!</text></svg>
          </div>
          <div class="alert-text">
            <div class="alert-label">Event alert</div>
            <div class="alert-msg">Non-Wando Guests must fill our Guest Form!</div>
          </div>
        </div>
        <button class="alert-plus" aria-label="More">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><line x1="9" y1="3" x2="9" y2="15" stroke="#333" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="9" x2="15" y2="9" stroke="#333" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <!-- Available pill -->
      <div class="avail-pill">
        <div class="avail-badge">1</div>
        <span class="avail-label">Available</span>
      </div>
